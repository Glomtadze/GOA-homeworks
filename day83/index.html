<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <img src="bg-mobile-light.jpg" class="img1">
    <div class="div1">
        <h2>T O D O</h2>
        <img src="icon-moon.svg">
    </div>
    <div class="div2">
        <div class="circle"></div>
        <input type="text" placeholder="create a new todo...">
    </div>
    <div class="list">
        <div class="row completed">
            <div class="circle checked">
                <img src="icon-check.svg">
            </div>
            <p>Complete online JavaScript course</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="row">
            <div class="circle"></div>
            <p>Jog around the park 3x</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="row">
            <div class="circle"></div>
            <p>10 minutes meditation</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="row">
            <div class="circle"></div>
            <p>Read for 1 hour</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="row">
            <div class="circle"></div>
            <p>Pick up groceries</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="row">
            <div class="circle"></div>
            <p>Complete Todo App on Frontend Mentor</p>
            <img src="icon-cross.svg" class="cross">
        </div>
        <div class="last">
            <p>5 items left</p>
            <p>Clear Completed</p>
        </div>
    </div>
    <div class="box">
        <p class="blue">All</p>
        <p>Active</p>
        <p>Completed</p>
    </div>
    <p class="lastp">Drag and drop to reorder list</p>
</body>

</html>
