<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 1) ახსენით რას ნიშნავს შემდეგი attribute selector და რომელ ელემენტებს მონიშნავს:
   - input[type="text"] -->
    <!-- ის მონიშნავს იმ ინფუთებს რომლებსაც type მითითებული აქვთ Text -->

    <!-- 2) ახსენით, რა განსხვავებაა შემდეგ სელექტორებს შორის:
   - input-ყველა ინფუთს მონიშნავს
   - [type="text"]-მონიშნავს ისეთ ელემენტებს რომლებიც არის ტექსტის ტიპის
   - input[type="text"]-მონიშმავს ისეთ ინფუთებს მხოლოდ რომლებსაც ტექსტის ტიპი აქვს მითითებული-->

    <!-- 3) შექმენით ფორმა, რომელშიც იქნება:
   - სახელის ველი — type="text"
   - გვარის ველი — type="text"
   - ქალაქის ველი — type="text"
   - პაროლის ველი — type="password"
   - გაგზავნის ღილაკი — type="submit"

   input[type="text"] სელექტორის გამოყენებით მხოლოდ ტექსტურ ველებს მიანიჭეთ განსხვავებული:

   - ტექსტის ფერი
   - ფონის ფერი
   - ჩარჩო
   - margin
   - padding -->
    <form>
        <input type="text" placeholder="name">
        <br>
        <input type="text" placeholder="lastname">
        <br>
        <input type="text" placeholder="city">
        <br>
        <input type="password" placeholder="password">
        <br>
        <input type="submit">
    </form>
    <br><br>

    <!-- 4) ახსენით, რა განსხვავებაა margin-სა და padding-ს შორის. პასუხში აღწერეთ, სად იქმნება თითოეული მათგანის დაშორება. -->
    <!-- margin-დაშორებას ქმნის ბორდერის გარეთ.padding-ქმნის ტექსტს და ბორდერს შორის -->

    <!-- 5) ახსენით რას აკეთებს თითოეული property:

   - margin-top-ქმნის დაშორებას ელემენტის ზევით
   - margin-right-ქმნის დაშორებას ელემენტის მარჯვნივ
   - margin-bottom-ქმნის დაშორებას ელემენტის დაბლა
   - margin-left-ქმნის დაშორებას ელემენტის მარცხნივ
   - padding-top-ზრდის ბორდერსდა ტექსტს შორის დაშორებას ტექსტის ზევით
   - padding-right-ზრდის ბორდერსდა ტექსტს შორის დაშორებას ტექსტის მარჯვნივ
   - padding-bottom-ზრდის ბორდერსდა ტექსტს შორის დაშორებას ტექსტის ქვევით
   - padding-left-ზრდის ბორდერსდა ტექსტს შორის დაშორებას ტექსტის მარცხნივ-->

    <!-- 6) ახსენით, როგორ გადანაწილდება მნიშვნელობები ელემენტის ოთხ მხარეს:

   - margin: 20px;-მნიშვნელობა ენიჭება ოთხივე მხარეს
   - margin: 10px 30px;-პირველი მნიშვნელობა ენიჭება ზევით და ქვევით მეორე კი მარჯვნივ და მარცხნივ
   - margin: 10px 20px 30px;-პირველი ენიჭება ზედა მხარეს მეორე მარჯვენა და მარცხენა მხარეს მესამე კი ქვედა მხარეს (მოიძიეთ ინფო ამაზე)
   - margin: 10px 20px 30px 40px;-პირველი ენიჭება ზედა მხარეს მეორე მარჯვენა მხარეს მესამე ქვედა მხარეს და მეოთხე მარცხენა მხარეს -->

    <!-- 7) ახსენით, როგორ გადანაწილდება მნიშვნელობები ელემენტის ოთხ მხარეს:

   - padding: 15px;-ოთხივე მხარეს
   - padding: 10px 25px;-პირველი ზევით და ქვემოთ და მეორე მნიშვნელობა მარცხნივ და მარჯვნივ
   - padding: 5px 10px 20px;-პირველი ზედა მხარეს მეორე მარჯვენა და მარცხენა მხარეს და მესამე ქვემოთ     (მოიძიეთ ინფო ამაზე)
   - padding: 5px 10px 15px 20px;-პირველი ზევით შემდეგ მარჯვნივ შემდეგ ქვემოთ შემდეგ მარცხნივ -->

    <!-- 8) შექმენით სამი type="text" ველი. Longhand property-ების გამოყენებით თითოეულ ველს გაუწერეთ განსხვავებული:

   - ზედა გარე დაშორება
   - მარჯვენა გარე დაშორება
   - ქვედა გარე დაშორება
   - მარცხენა გარე დაშორება

   ამ დავალებაში margin shorthand-ის გამოყენება არ შეიძლება. -->
    <input type="text" class="input1" placeholder="margin">
    <br>
    <input type="text" class="input2" placeholder="margin">
    <br>
    <input type="text" class="input3" placeholder="margin">
    <br><br><br>
    <!-- 9) შექმენით ოთხი type="text" ველი. Longhand property-ების გამოყენებით ტექსტსა და ჩარჩოს შორის ოთხივე მხარეს განსხვავებული დაშორებები შექმენით.

   ამ დავალებაში padding shorthand-ის გამოყენება არ შეიძლება. -->
    <input type="text" class="pad1" placeholder="padding">
    <br>
    <input type="text" class="pad2" placeholder="padding">
    <br>
    <input type="text" class="pad3" placeholder="padding">
    <br>
    <input type="text" class="pad4" placeholder="padding">
    <br><br><br>
</body>

</html>
