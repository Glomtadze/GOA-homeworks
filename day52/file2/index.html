<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 10) შექმენით ორი ფორმა. ორივე ფორმაში გამოიყენეთ input[type="text"].

    - პირველ ფორმაში margin და padding დაწერეთ longhand property-ებით.
    - მეორე ფორმაში იგივე შედეგი მიიღეთ shorthand property-ებით. -->
    <form>
        <input type="text" placeholder="form1" class="f1">
    </form>
    <form>
        <input type="text" placeholder="form2" class="f2">
    </form>
    <br><br><br>
    <!-- 11) შექმენით მომხმარებლის რეგისტრაციის ფორმა, რომელშიც იქნება მინიმუმ 5 type="text" ველი.

   ყველა ტექსტურ ველს უნდა ჰქონდეს:

   - margin: 8px 12px;
   - padding: 10px 15px;
   - ჩარჩო
   - ფონის ფერი
   - ტექსტის ფერი

   პაროლის ველსა და გაგზავნის ღილაკზე ეს სტილები არ უნდა გავრცელდეს. -->
    <form class="f3">
        <input type="text" placeholder="name" id="name">
        <br>
        <input type="text" placeholder="lastname" id="lastname">
        <br>
        <input type="text" placeholder="country" id="country">
        <br>
        <input type="text" placeholder="city" id="city">
        <br>
        <input type="text" placeholder="adress" id="adress">
        <br>
        <input type="password" placeholder="password" id="password">
        <br>
        <input type="submit">
    </form>
</body>

</html>
