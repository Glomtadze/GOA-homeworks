<!-- 1) ახსენით, რას ნიშნავს display property და რა გავლენას ახდენს ის HTML ელემენტის განლაგებაზე. -->
<!-- display თვისება განსაზღვრავს იმას თუ როგორ თავსდება და გამოიყურება HTML ელემენტი ვებგვერდზე  -->

<!-- 2) ახსენით, რა განსხვავებაა შემდეგ display მნიშვნელობებს შორის:

- display: block-იკავებს მშობელი ელემენტის მთელ ხელმისაწვდომ სიგანეს;
- display: inline-იკავებს იმდენ სივრცეს, რამდენიც სჭირდება მის რეალურ შიგთავსს;
- display: inline-block-აერთიანებს ბლოკური და ინლაინ ელემენტების საუკეთესო თვისებებს; -->
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- 3) შექმენით სამი span ელემენტი.

    თითოეულს მიანიჭეთ:
    - width: 150px;
    - height: 100px;
    - padding: 20px;
    - background-color;

    შემდეგ გამოიყენეთ:
    - პირველზე display: inline;
    - მეორეზე display: inline-block;
    - მესამეზე display: block;

    შეადარეთ მათი ზომები და განლაგება. -->
    <span class="span1">first</span>
    <span class="span2">second</span>
    <span class="span3">third</span>
    <br><br><br>
    <!-- 4) ახსენით, რომელი მახასიათებლები აქვს block ელემენტს:
    მოიყვანეთ block ელემენტების მაგალითები. -->
    <!-- ახალი ხაზიდან დაწყება , მთელი სიგანის დაკავება , შეიძლება width და height შეცვლა.
    მაგალითებია:div , p , h1-h2..h6 , ul , ol , li-->

    <!-- 5) ახსენით, რომელი მახასიათებლები აქვს inline ელემენტს:
    მოიყვანეთ inline ელემენტების მაგალითები. -->
    <!-- ცდილობს რომ დაეტიოს ერტ ხაზზე , width და height შეცვლა შეუძლებელია.
    მაგალითებია:span , a , img -->

    <!-- 6) შექმენით სამი div ერთმანეთის გვერდით განთავსებისთვის.

    თითოეულს მიანიჭეთ:
    - width: 150px;
    - height: 100px;
    - background-color;
    - margin: 10px;

    თავდაპირველად დატოვეთ div ელემენტები ჩვეულებრივი block ქცევით.

    შემდეგ გამოიყენეთ:
    - display: inline-block;

    ახსენით, როგორ შეიცვალა ელემენტების განლაგება. -->
    <div class="div1">first</div>
    <div class="div2">second</div>
    <div class="div3">third</div>
    <br><br><br>
    <!-- 7) შექმენით ოთხი ელემენტი ერთ ხაზზე.

    თითოეულს გამოიყენეთ:
    - display: inline-block;
    - width: 100px;
    - height: 100px;
    - margin: 10px;
    - background-color;

    შეამცირეთ ბრაუზერის ფანჯრის სიგანე.

    დააკვირდით, რა ხდება მაშინ, როდესაც ყველა ელემენტი ერთ ხაზზე ვეღარ ეტევა. -->
    <div class="div4">1</div>
    <div class="div5">2</div>
    <div class="div6">3</div>
    <div class="div7">4</div>
    <br><br><br>
    <!-- 8) შექმენით ორი ერთნაირი ელემენტი.

    ორივეს მიანიჭეთ:
    - width: 200px;
    - height: 100px;
    - padding: 20px;
    - margin: 20px;
    - background-color;

    პირველს გამოიყენეთ display: inline;
    მეორეს გამოიყენეთ display: inline-block;

    შეადარეთ, როგორ მოქმედებს width, height და margin თითოეულ მათგანზე. -->
    <div class="div8">first</div>
    <div class="div9">second</div>
</body>

</html>
