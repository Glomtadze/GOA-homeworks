<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Results Summary</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="div1">
    <div class="div2">
      <div class="div3">Your Result</div>
      <div class="div4">
        <div class="div5">76</div>
        <div class="div6">of 100</div>
      </div>
      <div class="div7">
        <div class="div8">Great</div>
        <div class="div9">Your performance exceed 65% of the people conducting the test here!</div>
      </div>
    </div>
    <div class="div10">
      <div class="div11">Summary</div>

      <div class="div12">
        <div class="div13 reaction">
          <div class="div14">
            <img src="asets/icon-reaction.svg">
            <span>Reaction</span>
          </div>
          <div class="div15"><strong>80</strong> / 100</div>
        </div>
        <div class="div13 memory">
          <div class="div14">
            <img src="asets/icon-memory.svg">
            <span>Memory</span>
          </div>
          <div class="div15"><strong>92</strong> / 100</div>
        </div>
        <div class="div13 verbal">
          <div class="div14">
            <img src="asets/icon-verbal.svg">
            <span>Verbal</span>
          </div>
          <div class="div15"><strong>61</strong> / 100</div>
        </div>
        <div class="div13 visual">
          <div class="div14">
            <img src="asets/icon-visual.svg">
            <span>Visual</span>
          </div>
          <div class="div15"><strong>73</strong> / 100</div>
        </div>
      </div>
      <div class="div16">Continue</div>
    </div>
  </div>
</body>

</html>
